<button cdkOverlayOrigin #origin="cdkOverlayOrigin" type="button"
        class="nav-icon-button secondary icon stream-settings-trigger" title="Stream Settings"
        [attr.aria-label]="newReplay ? 'Stream Settings, new replay' : 'Stream Settings'"
        [attr.aria-expanded]="open" [attr.aria-controls]="settings.panelId" (click)="setOpen(!open)">
  <i class="bi bi-sliders" aria-hidden="true"></i>
  @if (newReplay) { <span class="settings-notification-dot" aria-hidden="true"></span> }
</button>
<shig-settings-panel #settings [origin]="origin" [centered]="centered" [open]="open" (openChange)="setOpen($event)"
                     [tabs]="tabs" [activeTab]="activeTab" (activeTabChange)="selectTab($event)">
  @if (open) {
    @switch (activeTab) {
      @case ('layout') {
        <section class="settings-section" aria-label="Layout">
        <h3 class="settings-heading"><i class="bi bi-grid" aria-hidden="true"></i>Layout</h3>
        <div class="stream-layout-settings">
          <div class="settings-box">
            <strong>Picture in picture</strong>
            <label class="d-block mt-2" for="scene-main-video">Main video</label>
            <select id="scene-main-video" class="form-select" [value]="editor?.savedMainVideoId ?? ''" #mainVideo
                    (change)="editor!.mainVideoId = mainVideo.value">
              <option value="">Choose slot</option>
              @for (slot of editor?.sceneSlots ?? []; track $index) {
                <option [value]="slot.id">{{ slot.label }}</option>
              }
            </select>
            <label class="d-block mt-2" for="scene-inset-video">Small video</label>
            <select id="scene-inset-video" class="form-select" [value]="editor?.savedInsetVideoId ?? ''" #insetVideo
                    (change)="editor!.insetVideoId = insetVideo.value">
              <option value="">Choose slot</option>
              @for (slot of editor?.sceneSlots ?? []; track $index) {
                <option [value]="slot.id">{{ slot.label }}</option>
              }
            </select>
            <button class="btn btn-outline-primary w-100 mt-2" type="button"
                    [disabled]="!editor?.mainVideoId || !editor?.insetVideoId || editor?.mainVideoId === editor?.insetVideoId"
                    (click)="editor?.savePictureInPicture()">Save picture in picture</button>
          </div>
          <label class="settings-box form-check form-switch d-flex align-items-center justify-content-between gap-3">
            <span class="form-check-label">Edit layout</span>
            <input class="form-check-input" type="checkbox" role="switch"
                   [checked]="editor?.layoutEditMode" [disabled]="!editor?.ready"
                   (change)="editor?.toggleLayoutEditMode()">
          </label>
          <div class="settings-box">
            <button class="btn btn-outline-primary w-100" type="button" [disabled]="!editor?.ready"
                    (click)="editor?.resetTileLayout()"><i class="bi bi-grid" aria-hidden="true"></i> Reset Tile Grid</button>
          </div>
        </div>
        </section>
      }
      @case ('overlay') {
        <section class="settings-section" aria-label="Overlays">
          <h3 class="settings-heading settings-heading-overlay"><i class="bi bi-layers" aria-hidden="true"></i>Overlays</h3>
          <shig-stream-overlay-menu></shig-stream-overlay-menu>
        </section>
      }
      @case ('guests') {
        <section class="settings-section" aria-label="Guests">
          <h3 class="settings-heading settings-heading-guests"><i class="bi bi-person-plus" aria-hidden="true"></i>Guests</h3>
          <div class="settings-box"><app-stream-friends [streamUuid]="streamUuid" [userUuid]="userUuid"></app-stream-friends></div>
        </section>
      }
      @case ('videos') { <ng-container [ngTemplateOutlet]="videosTemplate ?? null"></ng-container> }
      @case ('devices') {
        <section class="settings-section" aria-label="Devices">
          <h3 class="settings-heading settings-heading-overlay"><i class="bi bi-camera-video" aria-hidden="true"></i>Devices</h3>
          <div class="settings-box"><shig-device-management [streamUuid]="streamUuid"></shig-device-management></div>
        </section>
      }
    }
  }
</shig-settings-panel>
