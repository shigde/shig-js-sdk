<div class="modal d-block custom-static-modal show" tabindex="-1" id="modalDeviceCapture">
  <div class="modal-dialog modal-dialog-centered modal-lg" (click)="$event.stopPropagation()">
    <div class="modal-content rounded-3 shadow" [attr.aria-busy]="isLoading()">

      <!-- Header -->
      <div class="modal-header">
        <h1 class="modal-title fs-2" id="modalDeviceCaptureLabel">Device Settings</h1>
        @if (isStreamUpdateModus) {
          <button type="button" class="btn-close" data-bs-dismiss="modal" (click)="closeModal()"
          aria-label="Close" [disabled]="isLoading()"></button>
        }
      </div>

      <!-- Body -->
      <fieldset class="modal-body device-fields row g-4 p-4" [disabled]="isLoading()">

        <!-- Device Selectors -->
        <div class="selectors col-12 col-md-6">
          <div class="w-100">
            <label for="formGroupCamera" class="form-label">Camera:</label>
            <select class="form-select" id="formGroupCamera" [disabled]="isLoading() || !cameras.length"
              [ngModel]="selectedDevice.camera"
              (ngModelChange)="onCameraChange($event)">
              @for (device of cameras; track device.deviceId || $index) {
                <option [value]="device.deviceId">{{ device.label || 'Unknown Camera' }}</option>
              }
            </select>
          </div>

          <div class="w-100 mt-2">
            <label for="formGroupMicrophone" class="form-label">Microphone:</label>
            <select class="form-select" id="formGroupMicrophone" [disabled]="isLoading() || !microphones.length"
              [ngModel]="selectedDevice.microphone"
              (ngModelChange)="onMicrophoneChange($event)">
              @for (device of microphones; track device.deviceId || $index) {
                <option [value]="device.deviceId">{{ device.label || 'Unknown Microphone' }}</option>
              }
            </select>
          </div>

          <div class="w-100 mt-2">
            <label for="formGroupSpeaker" class="form-label">Speaker:</label>
            <select class="form-select" id="formGroupSpeaker" [disabled]="isLoading() || !speakers.length"
              [ngModel]="selectedDevice.speaker"
              (ngModelChange)="onSpeakerChange($event)">
              @for (device of speakers; track device.deviceId || $index) {
                <option [value]="device.deviceId">{{ device.label || 'Unknown Speaker' }}</option>
              }
            </select>
          </div>
        </div>

        <!-- Video Preview -->
        <div class="col-12 col-md-6 mt-2 text-center">
          <div class="device-preview">
            <video #videoElement autoplay playsinline muted class="w-100 rounded border"></video>
          </div>
          <app-audio-meter [stream]="stream" [segments]="20" orientation="horizontal" class="mt-3"></app-audio-meter>
        </div>

        <!-- Error -->
        @if (errorMessage) {
          <div class="col-12 text-danger fw-bold">
            {{ errorMessage }}
          </div>
        }
      </fieldset>

      <!-- Footer -->
      <div class="modal-footer">
        @if (isStreamUpdateModus) {
          <button type="button" class="btn btn-secondary" [disabled]="isLoading()" (click)="closeModal()">Close</button>
          <button type="button" class="btn btn-primary" [disabled]="isLoading() || !stream" (click)="select()">Update</button>
        }
        @if (!isStreamUpdateModus) {
          <button type="button" class="btn btn-secondary" [disabled]="isLoading()" (click)="closeModal()">Cancel</button>
          <button type="button" class="btn btn-primary" [disabled]="isLoading() || !stream" (click)="select()">Select</button>
        }
      </div>
      <shig-loading-indicator [active]="isLoading()" [local]="true"></shig-loading-indicator>
    </div>
  </div>
</div>
